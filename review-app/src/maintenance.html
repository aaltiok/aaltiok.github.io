<!doctype html><html><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><title>Private evidence import</title><style>body{font:15px system-ui;max-width:800px;margin:40px auto}textarea{width:100%;height:100px}button{padding:12px}#status{white-space:pre-wrap}</style></head><body><h1>Private evidence import</h1><p>Import verified source data into the existing database. Saved review choices are untouched.</p><textarea aria-label="Evidence import part" id="part"></textarea><button id="import">Import this part</button><p id="status" role="status">Ready</p><a href="/">Return to review</a><script>
const status=document.getElementById('status'),button=document.getElementById('import'),field=document.getElementById('part');button.onclick=async()=>{let parts;try{parts=JSON.parse(field.value);if(!Array.isArray(parts))throw Error('Expected a prepared part');}catch(e){status.textContent=e.message;return;}field.value='';button.disabled=true;try{for(let i=0;i<parts.length;i++){status.textContent=`Importing chunk ${i+1} of ${parts.length}…`;const r=await fetch('/api/evidence-import',{method:'POST',headers:{'Content-Type':'application/json'},body:parts[i].body});const b=await r.json();if(!r.ok)throw Error(b.error||'Import failed');}const r=await fetch('/api/evidence-status'),b=await r.json();status.textContent=`Part complete. ${b.total} records available; ${b.included} retained; ${b.excluded} excluded.`;}catch(e){status.textContent='Import stopped: '+e.message;}finally{button.disabled=false;}};
</script></body></html>
